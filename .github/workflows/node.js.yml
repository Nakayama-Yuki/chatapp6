name: Node.js CI(pnpm)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true

      - name: Type and lint checks
        run: pnpm ci:check

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-node-lts-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'app/**', 'components/**', 'lib/**', 'utils/**', 'public/**', '*config*') }}
          restore-keys: |
            ${{ runner.os }}-node-lts-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build production application
        run: pnpm build
