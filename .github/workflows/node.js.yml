# Generated by calculator/tools/web-ci/generate.py.
name: Node.js CI(pnpm)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true

      - name: Type and lint checks
        run: pnpm ci:check

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-node-lts-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'app/**', 'components/**', 'lib/**', 'utils/**', 'tests/**', 'public/**', '*config*') }}
          restore-keys: |
            ${{ runner.os }}-node-lts-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build production application
        run: pnpm build:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-only-key

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Test production application
        run: pnpm test:e2e

      - name: Upload Playwright reports
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-security-report/
          retention-days: 30
          if-no-files-found: ignore
